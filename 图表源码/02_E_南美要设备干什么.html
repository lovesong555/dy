<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script src="d3.min.js"></script><script src="topojson.min.js"></script><script src="lib.js"></script><script src="mapkit.js"></script><script src="chartkit.js"></script><script src="treekit.js"></script></head>
<body><div class="frame">
<div class="tag"><i></i>第02期 · 挖掘机去南美</div>
<h1>南美买挖掘机，<em>挖的是全世界要的东西</em></h1>
<div class="sub">蓬莱港区南美航线 + 南美资源与基建需求</div>
<div class="stage"><svg id="s"></svg></div>
<div class="foot"><div>来源：<b>USGS 2026矿产年鉴；半岛网2024-08-01；海报新闻2024-10-04；观察者网 2024-11-15</b>｜航线示意</div><div class="brand">DATA / 产业链</div></div>
</div>
<script>
let W;window.__init=async()=>{W=await loadWorld('110m');};
chart(t=>{const {w,h}=stageBox();const svg=d3.select('#s').attr('width',w).attr('height',h);svg.selectAll('*').remove();
  const proj=d3.geoNaturalEarth1().rotate([150,0]).fitExtent([[V?10:0,10],[V?w-10:w*.66,h-10]],{type:'MultiPoint',coordinates:V?[[110,40],[-35,-45]]:[[110,45],[-35,-50]]});
  baseMap(svg,W,proj,{'China':'#1c2a52','Chile':'#4a2a1e','Peru':'#4a2a1e','Brazil':'#163f3a','Guyana':'#3a3a1e','Ecuador':'#3a3a1e'});
  const g=svg.append('g'); const pl=[120.8,37.8];
  drawRoute(g,proj,[pl,[150,25],[-160,15],[-120,10],[-80.5,-1]],ease(seg(t,.05,.5)),{color:C.yellow,w:6,dash:'2 12'});
  drawRoute(g,proj,[pl,[150,30],[-150,20],[-100,12],[-79.6,9],[-70,12],[-58.2,6.8]],ease(seg(t,.1,.55)),{color:C.yellow,w:6,dash:'2 12'});
  cityDot(g,proj(pl),'蓬莱港区',{color:C.yellow,r:22,fs:30,dy:-34,anchor:'start',dx:-10});
  if(t>.5){cityDot(g,proj([-80,-1.5]),'厄瓜多尔',{color:C.yellow,r:14,fs:24,dx:-10,anchor:'end',dy:8});cityDot(g,proj([-58.2,6.8]),'圭亚那',{color:C.yellow,r:14,fs:24,dy:-24});}
  const notes=[[[-70,-25],'智利','铜 530万吨/年 全球第一',C.orange],[[-75,-11],'秘鲁','铜 270万吨 · 钱凯港',C.orange],[[-50,-12],'巴西','铁矿石 4.2亿吨 全球第二',C.aqua]];
  notes.forEach((n,i)=>{if(t<.55+i*.1)return;const p=proj(n[0]);cityDot(g,p,null,{color:n[3],r:16});
    const lx=V?w-20:w*.68, ly=V?h*.66+i*100:h*.3+i*140; g.append('path').attr('d',`M${p[0]},${p[1]} L${lx-10},${ly-10}`).attr('stroke',n[3]).attr('stroke-width',2).attr('fill','none').attr('opacity',.7);
    txt(g,lx,ly,n[1],{fs:V?32:36,fw:900,fill:n[3],anchor:V?'end':'start'});txt(g,lx,ly+(V?40:44),n[2],{fs:V?26:28,fill:C.t1,anchor:V?'end':'start'});});
  if(t>.9){const lx=V?20:w*.68, ly=V?h*.08:h*.08; txt(g,lx,ly,'2024-07 蓬莱→圭亚那：218台工程车',{fs:V?26:26,fw:700,fill:C.yellow});txt(g,lx,ly+40,'2024-10 蓬莱→厄瓜多尔：钢材、水泥',{fs:V?26:26,fw:700,fill:C.yellow});}
});
</script></body></html>
