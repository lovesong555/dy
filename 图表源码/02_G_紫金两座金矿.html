<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script src="d3.min.js"></script><script src="topojson.min.js"></script><script src="lib.js"></script><script src="mapkit.js"></script><script src="chartkit.js"></script><script src="treekit.js"></script></head>
<body><div class="frame">
<div class="tag"><i></i></div>
<h1>紫金在加勒比海边，<em>还在加码</em></h1>
<div class="sub">紫金黄金国际：两座金矿的产金量（吨）</div>
<div class="stage"><svg id="s"></svg></div>
<div class="foot"><div>来源：<b>紫金黄金国际（2259.HK）2025年报、2026年中期公告</b>｜“扩建后”为公司规划目标</div><div class="brand">DATA / 产业链</div></div>
</div>
<script>
chart(t=>{const {svg,w,h}=S();const g=svg.append('g');
  const D=[['Aurora · 圭亚那',[4.1,4.5,6],C.aqua],['Rosebel · 苏里南',[7.5,8.3,13],C.orange]]; const ks=['2024','2025','扩建后'];
  const m={l:20,r:20,t:70,b:130}; const x0=d3.scaleBand().domain(D.map(d=>d[0])).range([m.l,w-m.r]).padding(.18); const x1=d3.scaleBand().domain(ks).range([0,x0.bandwidth()]).padding(.12); const y=d3.scaleLinear().domain([0,15]).range([h-m.b,m.t]);
  g.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','#33406a').attr('stroke-width',2);
  D.forEach((d,i)=>{d[1].forEach((v,j)=>{const p=easeOut(seg(t,(i*3+j)*.1,(i*3+j)*.1+.3));const X=x0(d[0])+x1(ks[j]);const yy=y(v*p);
      g.append('rect').attr('x',X).attr('y',yy).attr('width',x1.bandwidth()).attr('height',y(0)-yy).attr('rx',8).attr('fill',d[2]).attr('opacity',j==2?.45:1).attr('stroke',j==2?d[2]:'none').attr('stroke-dasharray',j==2?'8 6':null).attr('stroke-width',3);
      if(p>.9) txt(g,X+x1.bandwidth()/2,yy-14,v+'吨',{anchor:'middle',fs:V?30:34,fw:900});
      txt(g,X+x1.bandwidth()/2,y(0)+34,ks[j],{anchor:'middle',fs:V?22:24,fill:C.t2});});
    txt(g,x0(d[0])+x0.bandwidth()/2,y(0)+84,d[0],{anchor:'middle',fs:V?30:34,fw:900,fill:d[2]});});
  if(t>.92) txt(g,w/2,36,'2026年紫金黄金国际南美产量指引22.9吨，占38.6%',{anchor:'middle',fs:V?26:30,fw:900,fill:C.yellow});
});
</script></body></html>
