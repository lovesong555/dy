<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script src="d3.min.js"></script><script src="topojson.min.js"></script><script src="lib.js"></script><script src="mapkit.js"></script><script src="chartkit.js"></script><script src="treekit.js"></script></head>
<body><div class="frame">
<div class="tag"><i></i></div>
<h1>家族公司卖给玖龙的原料，<em>三年少了四分之三</em></h1>
<div class="sub">玖龙向张茵家族公司（美国中南等）的采购额（亿元，公告口径）</div>
<div class="stage"><svg id="s"></svg></div>
<div class="foot"><div>来源：<b>玖龙纸业港交所关连交易公告 2017-05-08、2020-06-02、2023-05-25、2026-05-18</b>｜口径逐年扩大：2020起含天津中南，2023起含海南中南及浆，2026起含木片</div><div class="brand">DATA / 产业链</div></div>
</div>
<script>
chart(t=>{const {svg,w,h}=S();
  columns(svg,w,h*.8,t,{max:360,dec:1,vfs:V?36:40,kfs:V?24:26,top:70,bottom:100,pad:.3,
   data:[{k:'FY2016',v:90.1,color:C.muted},{k:'FY2019',v:228.7,color:C.blue},{k:'FY2022',v:328.2,color:C.blue,note:'峰值'},{k:'FY2024',v:204.4,color:C.orange},{k:'FY2025',v:79.8,color:C.orange}]});
  if(t>.85){const p=seg(t,.85,1);const g=svg.append('g').attr('opacity',p);
    txt(g,0,h*.88,'2022→2025 财年：328 亿 → 80 亿（全年，公告口径）',{fs:V?28:32,fw:900,fill:C.yellow});
    txt(g,0,h*.88+(V?44:48),'另：FY2026 上半年 22.7 亿（半年数，不能和全年直接比）',{fs:V?22:26,fill:C.t2});}
});
</script></body></html>
