<body><div class="frame">

</div>
<script>
chart(t=>{const {svg,w,h}=S();

  if(t>.95){txt(svg,90,h-110,V?'蓝：原奶售价  橙：饲料成本':'',{fs:26,fill:C.t2});txt(svg,w-10,40,'2024年亏14.2亿 → 2026上半年扭亏0.42亿',{anchor:'end',fs:V?28:30,fw:900,fill:C.yellow});}
