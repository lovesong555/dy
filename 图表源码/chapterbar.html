<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NS;src:url(NotoSansCJKsc-Bold.otf);font-weight:700}
@font-face{font-family:NS;src:url(NotoSansCJKsc-Black.otf);font-weight:900}
html,body{margin:0;background:transparent;font-family:NS}
.bar{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;padding:18px 24px;background:linear-gradient(180deg,rgba(6,10,22,.92),rgba(6,10,22,.75));border-bottom:2px solid rgba(255,194,51,.5)}
.it{flex:1;display:flex;align-items:center;gap:10px;justify-content:center;border-radius:10px;padding:10px 8px;color:#7d88a6;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it b{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid currentColor;flex:none}
.it.on{background:#ffc233;color:#0a0f1e;font-weight:900;box-shadow:0 0 22px rgba(255,194,51,.55)}
.it.done{color:#c6cde0}
</style></head><body><div class="bar" id="b"></div>
<script>
const Q=new URLSearchParams(location.search),ep=Q.get('ep'),cur=+Q.get('i'),V=Q.get('o')==='v';
fetch('chapters.json').then(r=>r.json()).then(async C=>{const b=document.getElementById('b');
 const fs=V?30:30, bs=V?34:34;
 C[ep].forEach((t,k)=>{const d=document.createElement('div');d.className='it'+(k+1===cur?' on':k+1<cur?' done':'');d.style.fontSize=fs+'px';
  d.innerHTML=`<b style="width:${bs}px;height:${bs}px;font-size:${fs*0.75}px">${k+1}</b><span>${t}</span>`;b.appendChild(d);});
 await document.fonts.ready; window.__ready=true;});
</script></body></html>
