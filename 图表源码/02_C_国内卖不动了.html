<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script src="d3.min.js"></script><script src="topojson.min.js"></script><script src="lib.js"></script><script src="mapkit.js"></script><script src="chartkit.js"></script><script src="treekit.js"></script></head>
<body><div class="frame">
<div class="tag"><i></i>第02期 · 挖掘机去南美</div>
<h1>国内少卖一半，<em>出口补了回来</em></h1>
<div class="sub">中国挖掘机销量（万台，主要制造企业）</div>
<div class="stage"><svg id="s"></svg></div>
<div class="foot"><div>来源：<b>中国工程机械工业协会（经界面、观察者网、智通财经转引）</b>｜2023年分项未核，仅显示总量</div><div class="brand">DATA / 产业链</div></div>
</div>
<script>
chart(t=>{const {svg,w,h}=S();const g=svg.append('g');
  const D=[['2021',27.44,6.84],['2022',15.19,10.95],['2023',null,null,19.5],['2024',10.05,10.06],['2025',11.85,11.67]];
  const m={l:20,r:20,t:90,b:90}; const x=d3.scaleBand().domain(D.map(d=>d[0])).range([m.l,w-m.r]).padding(.3); const y=d3.scaleLinear().domain([0,38]).range([h-m.b,m.t]);
  g.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','#33406a').attr('stroke-width',2);
  D.forEach((d,i)=>{const p=easeOut(seg(t,i*.12,i*.12+.4)); const X=x(d[0]),bw=x.bandwidth();
    if(d[1]==null){const yy=y(d[3]*p);g.append('rect').attr('x',X).attr('y',yy).attr('width',bw).attr('height',y(0)-yy).attr('rx',8).attr('fill',C.muted);if(p>.9)txt(g,X+bw/2,yy-14,'约19.5',{anchor:'middle',fs:30,fw:900});}
    else{const y1=y(d[1]*p),y2=y((d[1]+d[2])*p);
      g.append('rect').attr('x',X).attr('y',y1).attr('width',bw).attr('height',y(0)-y1).attr('rx',8).attr('fill',C.blue);
      g.append('rect').attr('x',X).attr('y',y2).attr('width',bw).attr('height',Math.max(0,y1-y2-3)).attr('rx',8).attr('fill',C.orange);
      if(p>.9){txt(g,X+bw/2,(y1+y(0))/2,fmt(d[1],1),{anchor:'middle',base:'middle',fs:V?26:30,fw:900,fill:'#0a0f1e'});txt(g,X+bw/2,(y1+y2)/2,fmt(d[2],1),{anchor:'middle',base:'middle',fs:V?26:30,fw:900,fill:'#0a0f1e'});txt(g,X+bw/2,y2-14,fmt(d[1]+d[2],1),{anchor:'middle',fs:V?28:32,fw:900});}}
    txt(g,X+bw/2,y(0)+40,d[0],{anchor:'middle',fs:28,fill:C.t2});});
  [[C.blue,'国内'],[C.orange,'出口']].forEach((l,i)=>{g.append('rect').attr('x',w-(V?300:340)+i*150).attr('y',20).attr('width',26).attr('height',26).attr('rx',6).attr('fill',l[0]);txt(g,w-(V?260:300)+i*150,42,l[1],{fs:28,fw:700});});
  if(t>.95) txt(g,m.l,40,'国内：27.4万 → 11.9万（只剩峰值43%）',{fs:V?26:30,fw:900,fill:C.yellow});
});
</script></body></html>
