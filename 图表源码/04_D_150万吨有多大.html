<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script src="d3.min.js"></script><script src="topojson.min.js"></script><script src="lib.js"></script><script src="mapkit.js"></script><script src="chartkit.js"></script><script src="treekit.js"></script></head>
<body><div class="frame">
<div class="tag"><i></i>第04期 · 牛奶与巴西大豆</div>
<h1>150万吨很多？<em>放进全国只占一格</em></h1>
<div class="sub">每格 ≈ 22.4万吨；中国2025年进口大豆 11,183 万吨 = 500 格</div>
<div class="stage"><svg id="s"></svg></div>
<div class="foot"><div>来源：<b>国家统计局2025统计公报；中粮集团 2025-05-29</b>｜150万吨÷6年≈每年25万吨（自算）</div><div class="brand">DATA / 产业链</div></div>
</div>
<script>
chart(t=>{const {svg,w,h}=S();const cols=V?20:40, rows=V?25:13; const n=500; const cell=Math.min(w/cols,(h-120)/rows); const r=cell*.36;
  const g=svg.append('g').attr('transform',`translate(${(w-cell*cols)/2},20)`);
  for(let i=0;i<n;i++){const cx=(i%cols)*cell+cell/2, cy=Math.floor(i/cols)*cell+cell/2; const show=seg(t,i/n*.7,i/n*.7+.05);
    const hl=i===n-1; g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',hl?r*1.25:r*show).attr('fill',hl?C.yellow:'#2d4f9a').attr('opacity',hl?seg(t,.8,.9):1);
    if(hl&&t>.9){g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r*2.6).attr('fill','none').attr('stroke',C.yellow).attr('stroke-width',3);}}
  if(t>.9){txt(svg,w/2,h-50,'黄色这一格：中粮—蒙牛协议每年约25万吨 ≈ 0.2%',{anchor:'middle',fs:V?32:32,fw:900,fill:C.yellow});}
});
</script></body></html>
